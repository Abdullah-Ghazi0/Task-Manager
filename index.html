<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Task Manager</title>
</head>
<body>
    <header>
        <h1>Task Manager</h1>
    </header>
    <div class="container">
        <div class="input">
            <button id="newTaskBtn">Add New Task</button>
        </div>
        <search class="search-bar">
            <div class="control-group search-group">
                <label for="searchField" class="searchLabel">Search</label>
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="search" id="searchField" placeholder="Search tasks..">
                </div>
            </div>
            <div class="control-group">
                <label for="priorityFilter">Priority</label>
                <select name="priorityFilter" id="priorityFilter">
                    <option value="" selected>All</option>
                    <option value="High">High</option>
                    <option value="Mid">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="control-group">
                <label for="dateFilter">Due Date</label>
                <select name="dateFilter" id="dateFilter">
                    <option value="" selected>All</option>
                    <option value="overDue">Overdue</option>
                    <option value="dueToday">Due Today</option>
                    <option value="dueTomorrow">Due Tomorrow</option>
                    <option value="upcoming">Later</option>
                    <option value="noDate">No Due Date</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sort">Sort By</label>
                <select name="sort" id="sort">
                    <option value="">Custom</option>
                    <option value="created">Created</option>
                    <option value="dueDateA">Due Date (Earliest)</option>
                    <option value="dueDateD">Due Date (Latest)</option>
                    <option value="prioA">Priority (Low → High)</option>
                    <option value="prioD">Priority (High → Low)</option>
                </select>
            </div>
        </search>
        <div class="tasks">
            <div class="column">
                <h2>Todo <span id="todoCount"></span></h2>
                <div id="todo" class="taskList empty">No tasks yet</div>
            </div>
            <div class="column">
                <h2>In-progress <span id="doingCount"></span></h2>
                <div id="inProgress" class="taskList empty">No tasks yet</div>
            </div>
            <div class="column">
                <h2>Completed <span id="doneCount"></span></h2>
                <div id="completed" class="taskList empty">No tasks yet</div>
            </div>
        </div>
    </div>
    <div class="modal-overlay">
        <div class="modal">
            <button class="close">&times;</button>
            <div class="modal-head">
                Create New Task
            </div>
            <form class="modal-form" action="#">
                <div class="group">
                    <label for="title" class="fieldLabel">Title:</label>
                    <input type="text" class="inputField titleField" name="title" id="title" placeholder="Enter a Title" autocomplete="off">
                </div>
                <div class="group">
                    <label for="priority" class="fieldLabel">Priority:</label>
                    <select name="priority" id="priority" class="inputField">
                        <option value="Low" selected>Low</option>
                        <option value="Mid">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="group">
                    <label for="dueDate" class="fieldLabel">Due Date:</label>
                    <input type="date" class="inputField" id="dueDate" name="dueDate">
                </div>
                <div class="group">
                    <label for="description" class="fieldLabel">Description:</label>
                    <textarea class="inputField descriptionField" name="description" id="description" placeholder="Enter a task description"></textarea>
                </div>
            </form>
            <button id="addTask" class="createBtn disabled">Create Task</button>
        </div>
    </div>
    <template>
        <div class="card dragable">
            <div class="card-normal">
                <div class="card-head">
                    <div class="card-head-top">
                        <h3 class="card-title"></h3>
                        <span class="expand-icon">▾</span>
                    </div>
                    <p class="card-desc"></p>
                </div>
                <div class="created-at"></div>
                <div class="card-details">
                    <div class="prio"></div>
                    <span class="card-date"></span>
                </div>
                <div class="card-action">
                    <select name="status" id="status" class="card-status">
                        <option value="todo">Todo</option>
                        <option value="inProgress">In-progress</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button class="card-edit">🖊</button>
                    <button class="card-delete">🗑</button>
                </div>
            </div>
            <div class="card-confirm">
                <p class="note">Are you sure you want to delete this task?</p>
                <div class="del-btns">
                    <button class="cancel-del">Cancel</button>
                    <button class="confirm-del">Confirm Delete</button>
                </div>
            </div>
        </div>
    </template>
    <button class="fab" id="fabBtn">+</button>

    <script type="module" src="./src/main.js" defer></script>
</body>
</html>
