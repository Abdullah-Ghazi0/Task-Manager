<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task Manager</title>
</head>
<body>
    <header>
        <h1>Task Manager</h1>
    </header>
    <div class="container">
        <div class="input">
            <input type="text">
            <button>Add Task</button>
        </div>
        <div class="tasks">
            <div class="column">
                <h2>Todo</h2>
                <div id="todo" class="taskList"></div>
            </div>
            <div class="column">
                <h2>In-progress</h2>
                <div id="doing" class="taskList"></div>
            </div>
            <div class="column">
                <h2>Completed</h2>
                <div id="done" class="taskList"></div>
            </div>
        </div>
    </div>
    <template>
        <div class="card">
            <h3></h3>
            <p></p>
            <select name="status" id="status">
                <option value="todo">Todo</option>
                <option value="doing">In-progress</option>
                <option value="done">Completed</option>
            </select>
            <button>Delete</button>

        </div>
    </template>
    <script src="script.js" defer></script>
</body>
</html>
