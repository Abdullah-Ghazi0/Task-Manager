<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task Manager</title>
</head>
<body>
    <header>
        <h1>Task Manager</h1>
    </header>
    <div class="container">
        <div class="input">
            <input type="text">
            <button>Add Task</button>
        </div>
        <div class="tasks">
            <div class="taskList">
                <h2>Todo</h2>
                <div id="todo"></div>
            </div>
            <div class="taskList">
                <h2>In-progress</h2>
                <div id="doing"></div>
            </div>
            <div class="taskList">
                <h2>Completed</h2>
                <div id="done"></div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
